[package]
name = "dashing"
version = "0.0.2"
authors = ["Ian Gowen <ian@gowen.cc>"]
license = "Apache-2.0"
publish = false
edition = "2021"
description = "ASCII-style roguelike engine"
repository = "https://github.com/igowen/dashing"
categories = ["game-development", "game-engines", "rendering::engine"]
resolver = "2"

[features]

[dependencies]
bytemuck = { version = "1.9.1", features = ["derive"] }
futures = "0.3.30"
futures-intrusive = "0.5"
wgpu = "0.20.1"
winit = "0.30.3"
log = "0.4.21"
time = "0.3.36"
itertools = "0.13.0"

[dev-dependencies]
image = "0.25.1"
png = "0.17.13"
pretty_env_logger = "0.5"
